<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>im sowwy 🥺💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#ffd9e8;
    --pink2:#ffb6d5;
    --pink3:#ff8fc4;
    --deep:#e94f9c;
    --card:#fff5fa;
    --text:#8a3b64;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:'Quicksand', sans-serif;
    background:linear-gradient(160deg, var(--pink1) 0%, var(--pink2) 45%, var(--pink3) 100%);
    touch-action:manipulation;
  }
  .sky{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:1;
  }
  .drift{
    position:absolute;
    bottom:-10vh;
    font-size:1.6rem;
    opacity:0.55;
    animation-name:float-up;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 2px 4px rgba(255,255,255,0.4));
  }
  @keyframes float-up{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.6; }
    100%{ transform:translateY(-115vh) rotate(360deg); opacity:0; }
  }

  .stage{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:32px;
    padding:clamp(24px, 6vw, 40px) clamp(20px, 6vw, 32px) clamp(28px, 6vw, 36px);
    text-align:center;
    box-shadow:0 20px 45px rgba(233,79,156,0.28), 0 0 0 6px rgba(255,255,255,0.6) inset;
    border:3px solid #ffc2e0;
    animation:pop-in 0.5s cubic-bezier(.26,1.4,.5,1);
  }
  @keyframes pop-in{
    0%{ transform:scale(0.7) translateY(30px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  .card.shake{ animation: pop-in 0.5s cubic-bezier(.26,1.4,.5,1), shake 0.5s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px) rotate(-1deg); }
    40%{ transform:translateX(8px) rotate(1deg); }
    60%{ transform:translateX(-6px) rotate(-1deg); }
    80%{ transform:translateX(6px) rotate(1deg); }
  }

  .mascot{
    font-size:clamp(48px, 14vw, 68px);
    display:inline-block;
    animation:wiggle 2.4s ease-in-out infinite;
    margin-bottom:4px;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(-8deg); }
    50%{ transform:rotate(8deg); }
  }

  h1{
    font-family:'Baloo 2', cursive;
    color:var(--deep);
    font-size:clamp(1.5rem, 6vw, 2.1rem);
    margin:6px 0 6px;
    line-height:1.25;
  }
  p.sub{
    color:var(--text);
    font-size:clamp(0.95rem, 3.6vw, 1.1rem);
    margin:0 0 22px;
    line-height:1.5;
    font-weight:600;
  }

  .btn-row{
    display:flex;
    gap:14px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    min-height:70px;
    position:relative;
  }

  button{
    border:none;
    font-family:'Baloo 2', cursive;
    cursor:pointer;
    border-radius:999px;
    font-weight:700;
    transition: transform 0.15s ease, box-shadow 0.15s ease, font-size 0.25s ease, padding 0.25s ease, opacity 0.25s ease;
    -webkit-user-select:none; user-select:none;
  }
  button:active{ transform:scale(0.94); }

  #okBtn{
    background:linear-gradient(135deg,#ff9fce,#ff6fb0);
    color:#fff;
    padding:14px 30px;
    font-size:1.15rem;
    box-shadow:0 10px 20px rgba(255,111,176,0.45);
  }
  #okBtn:hover{ transform:translateY(-2px) scale(1.03); }

  #nopeBtn{
    background:#fff;
    color:var(--deep);
    border:2px solid #ffc2e0;
    padding:14px 26px;
    font-size:1.05rem;
    box-shadow:0 6px 14px rgba(233,79,156,0.15);
  }
  #nopeBtn.evasive{
    position:fixed;
    z-index:50;
  }

  .hint{
    margin-top:16px;
    font-size:0.82rem;
    color:#c46a97;
    font-weight:600;
    min-height:18px;
  }

  .counter{
    position:absolute;
    top:14px; right:18px;
    font-size:0.85rem;
    color:#d488ac;
    font-weight:700;
  }

  /* success screen */
  .success{
    display:none;
  }
  .success .mascot{ animation:bounce 1s ease-in-out infinite; }
  @keyframes bounce{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-14px) rotate(4deg); }
  }

  .confetti{
    position:fixed; inset:0; pointer-events:none; z-index:40; overflow:hidden;
  }
  .confetti span{
    position:absolute;
    top:-40px;
    font-size:1.4rem;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(400deg); }
  }

  @media (max-width:360px){
    .btn-row{ gap:10px; }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="stage">
  <div class="card" id="card">

    <div id="apologyView">
      <div class="counter" id="counter"></div>
      <div class="mascot" id="mascot">🐻</div>
      <h1 id="mainMsg">Hey... I'm sorry 🥺</h1>
      <p class="sub" id="subMsg">Can we be okay again? Pretty please?</p>
      <div class="btn-row">
        <button id="okBtn">Okay 💗</button>
        <button id="nopeBtn">Nope</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div id="successView" class="success">
      <div class="mascot">🥰</div>
      <h1>Yayyy!! 🎉💕</h1>
      <p class="sub">Thank you for forgiving me! I love you sooo much, my bear hugs are already on the way 🐻💗🌸</p>
      <div class="btn-row" style="justify-content:center;">
        <button id="replayBtn" style="background:linear-gradient(135deg,#ffb6d5,#ff8fc4); color:#fff; padding:12px 24px; font-size:1rem; box-shadow:0 8px 16px rgba(255,143,196,0.4);">do it again 🥺</button>
      </div>
    </div>

  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
  // ---------- background floating emojis ----------
  const bgEmojis = ['💗','🌸','✨','🎀','🐰','💕','⭐','🩷','🦋','🌷'];
  const sky = document.getElementById('sky');
  for(let i=0;i<22;i++){
    const el = document.createElement('div');
    el.className = 'drift';
    el.textContent = bgEmojis[i % bgEmojis.length];
    el.style.left = (Math.random()*100) + 'vw';
    el.style.fontSize = (1 + Math.random()*1.6) + 'rem';
    const dur = 9 + Math.random()*10;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random()*dur) + 's';
    sky.appendChild(el);
  }

  // ---------- apology stages ----------
  const stages = [
    { main: "Hey... I'm sorry 🥺", sub: "Can we be okay again? Pretty please?" },
    { main: "Sorry!! 🙈💗", sub: "I know I messed up, I promise I'll do better." },
    { main: "Soooorryyy 😢🌸", sub: "I really really am, don't be mad at meee." },
    { main: "SORRYYY 🥹🎀", sub: "My heart actually hurts when you're upset with me." },
    { main: "sorry sorry sorry 🐰💕", sub: "I'll bring snacks, hugs, and cuddles — everything!" },
    { main: "SUPER DUPER SORRYYY 🎉💖", sub: "Okay the Nope button is literally too scared to be clicked now... take that as a sign 😌" }
  ];

  const mascots = ['🐻','🙈','🥺','😿','🐰','🦋'];

  const mainMsg = document.getElementById('mainMsg');
  const subMsg = document.getElementById('subMsg');
  const mascot = document.getElementById('mascot');
  const nopeBtn = document.getElementById('nopeBtn');
  const okBtn = document.getElementById('okBtn');
  const hint = document.getElementById('hint');
  const counter = document.getElementById('counter');
  const card = document.getElementById('card');
  const apologyView = document.getElementById('apologyView');
  const successView = document.getElementById('successView');

  let nopeCount = 0;
  const maxScaleStage = stages.length - 1;
  let evasive = false;

  const evasiveTaunts = [
    "Nuh-uh, can't catch me! 😜",
    "Too slow~ 🏃‍♀️💨",
    "I'm just shy, not sorry-less! 🙈",
    "Catch me if you can 💫",
    "Nope means nope 😌🎀",
    "Okay fine I'll stay still... jk 😝"
  ];

  function setStage(i){
    mainMsg.textContent = stages[i].main;
    subMsg.textContent = stages[i].sub;
    mascot.textContent = mascots[i % mascots.length];
    counter.textContent = i > 0 ? '🥺 x' + i : '';
    card.classList.remove('shake');
    // retrigger shake animation
    void card.offsetWidth;
    card.classList.add('shake');
  }

  function shrinkNope(){
    const scale = Math.max(1 - nopeCount * 0.16, 0.34);
    nopeBtn.style.fontSize = (1.05 * scale) + 'rem';
    nopeBtn.style.padding = (14*scale) + 'px ' + (26*scale) + 'px';
    nopeBtn.style.opacity = Math.max(1 - nopeCount*0.05, 0.6);
  }

  function randomSafePosition(){
    const w = nopeBtn.offsetWidth || 60;
    const h = nopeBtn.offsetHeight || 40;
    const pad = 16;
    const maxX = window.innerWidth - w - pad;
    const maxY = window.innerHeight - h - pad;
    const x = pad + Math.random() * Math.max(maxX - pad, 10);
    const y = pad + Math.random() * Math.max(maxY - pad, 10);
    return {x, y};
  }

  function activateEvasive(){
    evasive = true;
    nopeBtn.classList.add('evasive');
    const {x,y} = randomSafePosition();
    nopeBtn.style.left = x + 'px';
    nopeBtn.style.top = y + 'px';
    hint.textContent = "the nope button ran away... it's scared 🫣";
  }

  function evade(e){
    if(!evasive) return;
    e.preventDefault();
    const {x,y} = randomSafePosition();
    nopeBtn.style.transition = 'left 0.28s cubic-bezier(.2,1.4,.4,1), top 0.28s cubic-bezier(.2,1.4,.4,1), transform 0.2s ease';
    nopeBtn.style.left = x + 'px';
    nopeBtn.style.top = y + 'px';
    nopeBtn.style.transform = 'rotate(' + (Math.random()*30-15) + 'deg)';
    hint.textContent = evasiveTaunts[Math.floor(Math.random()*evasiveTaunts.length)];
  }

  nopeBtn.addEventListener('click', (e)=>{
    if(evasive){ evade(e); return; }
    nopeCount++;
    const idx = Math.min(nopeCount, maxScaleStage);
    setStage(idx);
    shrinkNope();
    if(nopeCount >= 5){
      setTimeout(activateEvasive, 250);
    }
  });

  // desktop: run away before they even manage to click, once evasive
  nopeBtn.addEventListener('pointerenter', evade);
  nopeBtn.addEventListener('mousedown', evade);
  // mobile: run away on touch-start so the tap never lands
  nopeBtn.addEventListener('touchstart', evade, {passive:false});

  window.addEventListener('resize', ()=>{
    if(evasive){
      const {x,y} = randomSafePosition();
      nopeBtn.style.left = x + 'px';
      nopeBtn.style.top = y + 'px';
    }
  });

  // ---------- OK / success ----------
  function launchConfetti(){
    const confetti = document.getElementById('confetti');
    const pieces = ['💗','🎉','🌸','✨','🎀','💕','🩷','⭐'];
    for(let i=0;i<50;i++){
      const s = document.createElement('span');
      s.textContent = pieces[Math.floor(Math.random()*pieces.length)];
      s.style.left = (Math.random()*100) + 'vw';
      s.style.fontSize = (1 + Math.random()*1.4) + 'rem';
      const dur = 2.5 + Math.random()*2.5;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (Math.random()*0.6) + 's';
      confetti.appendChild(s);
      setTimeout(()=> s.remove(), (dur+1)*1000);
    }
  }

  okBtn.addEventListener('click', ()=>{
    apologyView.style.display = 'none';
    successView.style.display = 'block';
    launchConfetti();
  });

  document.getElementById('replayBtn').addEventListener('click', ()=>{
    nopeCount = 0;
    evasive = false;
    nopeBtn.classList.remove('evasive');
    nopeBtn.style.left = '';
    nopeBtn.style.top = '';
    nopeBtn.style.transform = '';
    nopeBtn.style.fontSize = '';
    nopeBtn.style.padding = '';
    nopeBtn.style.opacity = '';
    hint.textContent = '';
    setStage(0);
    successView.style.display = 'none';
    apologyView.style.display = 'block';
  });

  setStage(0);
</script>

</body>
</html>
